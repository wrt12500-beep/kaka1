<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱 我的小目标</title>
<meta name="theme-color" content="#FF9BB5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小目标">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
:root{
  --cream:#FFF8F0;--peach:#FFE4CC;--pink:#FF9BB5;--rose:#FF6B8A;
  --lilac:#E8D5F5;--purple:#B57BEE;--gold:#FFD166;--amber:#FFB347;
  --mint:#C8F5E4;--teal:#4ECBA0;--sky:#D4EEFF;--blue:#6BB8F5;
  --dark:#3D2B1F;--mid:#8B6B5A;--light:#C4A882;
  --white:#FFFCF8;--shadow:rgba(61,43,31,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--dark);
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  position:relative;
  overflow:hidden;
}

/* ── SCROLLABLE CONTENT ── */
.page{display:none;flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 80px;}
.page.active{display:block;}
/* custom scrollbar */
.page::-webkit-scrollbar{width:4px;}
.page::-webkit-scrollbar-track{background:transparent;}
.page::-webkit-scrollbar-thumb{background:var(--peach);border-radius:4px;}

/* ── NAV ── */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--white);
  border-top:2px solid var(--peach);
  display:flex;z-index:100;
  box-shadow:0 -4px 20px var(--shadow);
}
.nb{flex:1;padding:8px 2px 10px;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:'Nunito',sans-serif;font-size:0.6rem;font-weight:800;color:var(--light);transition:all 0.2s;}
.nb .ni{font-size:1.45rem;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);}
.nb.active{color:var(--rose);}
.nb.active .ni{transform:scale(1.25) translateY(-2px);}
.mute-btn{color:var(--teal);font-size:0.55rem;}
.mute-btn .ni{font-size:1.2rem;}

/* ── CARD ── */
.card{background:var(--white);border-radius:22px;padding:16px;margin-bottom:12px;
  box-shadow:0 4px 18px var(--shadow);border:1.5px solid rgba(255,180,150,0.15);}
.card-title{font-size:1rem;font-weight:900;color:var(--dark);margin-bottom:12px;
  display:flex;align-items:center;gap:6px;}

/* ── HEADER ── */
.pg-header{text-align:center;padding:14px 0 10px;position:relative;}
.pg-header h1{font-size:1.7rem;font-weight:900;color:var(--dark);letter-spacing:1px;}
.pg-header .sub{font-size:0.8rem;color:var(--mid);font-weight:700;margin-top:2px;}

/* stars pill */
.stars-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--gold),var(--amber));
  border-radius:50px;padding:7px 18px;
  font-weight:900;color:#7A4500;font-size:0.95rem;
  box-shadow:0 4px 14px rgba(255,179,0,0.3);
  margin-top:8px;
}
.stars-pill .si{animation:starBounce 1.4s ease-in-out infinite;font-size:1.2rem;}
@keyframes starBounce{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-5px) rotate(15deg);}}

/* ──────────────────────────────────
   HOME PAGE
────────────────────────────────── */
.task-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:16px;margin-bottom:8px;
  background:var(--cream);border:1.5px solid var(--peach);
  transition:all 0.3s;
}
.task-item.habit-t{background:var(--mint);border-color:rgba(78,203,160,0.3);}
.task-item.done-t{opacity:0.55;}
.task-item.done-t .t-name{text-decoration:line-through;color:var(--light);}
.check-btn{
  width:42px;height:42px;border-radius:50%;
  border:2.5px solid var(--peach);background:white;
  cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;flex-shrink:0;
}
.check-btn.checked{
  background:linear-gradient(135deg,var(--gold),var(--amber));
  border-color:var(--amber);
  animation:checkPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes checkPop{0%{transform:scale(0.4);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
.t-info{flex:1;min-width:0;}
.t-name{font-size:0.92rem;font-weight:800;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-meta{font-size:0.7rem;color:var(--mid);font-weight:700;margin-top:1px;}
.t-pts{font-size:0.85rem;font-weight:900;color:var(--amber);flex-shrink:0;}

/* badges */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.bdg{text-align:center;padding:9px 4px;border-radius:14px;
  background:#F8F3EE;border:1.5px solid var(--peach);transition:all 0.3s;}
.bdg.on{background:linear-gradient(135deg,#FFF9E6,#FFE9A0);border-color:var(--gold);
  box-shadow:0 3px 10px rgba(255,209,102,0.35);animation:glow 2s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 3px 10px rgba(255,209,102,0.35);}50%{box-shadow:0 3px 20px rgba(255,209,102,0.65);}}
.bdg .bi{font-size:1.6rem;filter:grayscale(1);opacity:0.3;transition:all 0.3s;}
.bdg.on .bi{filter:none;opacity:1;}
.bdg .bl{font-size:0.6rem;font-weight:800;color:var(--light);margin-top:3px;}
.bdg.on .bl{color:#B8860B;}

/* ──────────────────────────────────
   PET PAGE
────────────────────────────────── */

/* Animal select */
.animal-select-wrap{margin-bottom:14px;}
.animal-select-title{font-size:0.85rem;font-weight:800;color:var(--mid);margin-bottom:8px;}
.animal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.an-btn{
  aspect-ratio:1;border-radius:16px;border:2.5px solid var(--peach);
  background:var(--cream);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  font-family:'Nunito',sans-serif;
}
.an-btn:hover{transform:scale(1.08);}
.an-btn.selected{
  border-color:var(--rose);background:linear-gradient(135deg,#FFF0F5,#FFE0EC);
  box-shadow:0 4px 14px rgba(255,107,138,0.3);transform:scale(1.08);
}
.an-icon{font-size:1.8rem;}
.an-name{font-size:0.6rem;font-weight:800;color:var(--mid);}
.an-btn.selected .an-name{color:var(--rose);}

/* Pet scene */
.pet-scene{
  position:relative;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 55%,var(--mint) 55%,var(--mint) 100%);
  border-radius:20px;overflow:hidden;height:230px;
  margin-bottom:16px;
  border:2px solid rgba(107,184,245,0.3);
}
/* sky deco */
.scene-cloud{position:absolute;background:white;border-radius:50px;opacity:0.8;}
.scene-cloud::before,.scene-cloud::after{content:'';position:absolute;background:white;border-radius:50%;}
.sc1{width:70px;height:22px;top:18px;left:16px;animation:scf 6s ease-in-out infinite;}
.sc1::before{width:32px;height:32px;top:-16px;left:8px;}
.sc1::after{width:22px;height:22px;top:-10px;left:30px;}
.sc2{width:55px;height:18px;top:30px;right:20px;animation:scf 9s ease-in-out infinite reverse;}
.sc2::before{width:26px;height:26px;top:-13px;left:6px;}
.sc2::after{width:18px;height:18px;top:-8px;left:24px;}
@keyframes scf{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}
/* sun */
.scene-sun{position:absolute;top:10px;right:50px;width:38px;height:38px;
  background:radial-gradient(circle,#FFE566,#FFB300);border-radius:50%;
  box-shadow:0 0 18px rgba(255,215,0,0.6);}
/* ground details */
.scene-grass{position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,#A8E6CF,#7BC67E);}
.scene-flower{position:absolute;bottom:42%;font-size:1rem;}

/* pet avatar */
.pet-avatar-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;user-select:none;
}
.pet-avatar{font-size:5.5rem;transition:transform 0.2s;line-height:1;}
.pet-avatar.idle{animation:petIdle 3s ease-in-out infinite;}
.pet-avatar.happy{animation:petHappy 0.5s ease-in-out 3;}
.pet-avatar.eating{animation:petEat 0.4s ease-in-out 4;}
.pet-avatar.sleeping{animation:petSleep 4s ease-in-out infinite;}
@keyframes petIdle{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-8px) rotate(2deg);}}
@keyframes petHappy{0%,100%{transform:scale(1) rotate(0);}25%{transform:scale(1.2) rotate(-8deg);}75%{transform:scale(1.2) rotate(8deg);}}
@keyframes petEat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px) scale(1.1);}}
@keyframes petSleep{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-4px) rotate(3deg);}}

.pet-speech{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%) translateY(-100%);
  background:white;border-radius:16px;padding:6px 12px;
  font-size:0.78rem;font-weight:800;color:var(--dark);
  box-shadow:0 3px 12px var(--shadow);white-space:nowrap;
  border:1.5px solid var(--peach);
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
.pet-speech.show{opacity:1;}
.pet-speech::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:white;
}

.pet-name-tag{
  background:rgba(255,255,255,0.9);border-radius:50px;padding:4px 14px;
  font-size:0.75rem;font-weight:900;color:var(--rose);
  box-shadow:0 2px 8px var(--shadow);
  border:1.5px solid var(--peach);
  margin-top:6px;
}

/* pet info */
.pet-info-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.pet-lv{font-size:0.95rem;font-weight:900;color:var(--dark);}
.pet-mood-badge{
  font-size:0.75rem;font-weight:800;padding:4px 12px;border-radius:50px;
  background:var(--lilac);color:var(--purple);
}
.xp-row{margin-bottom:4px;}
.xp-label-row{display:flex;justify-content:space-between;
  font-size:0.72rem;font-weight:800;color:var(--mid);margin-bottom:5px;}
.xp-track{background:var(--peach);border-radius:50px;height:14px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--rose));
  border-radius:50px;transition:width 1.2s cubic-bezier(0.34,1.56,0.64,1);}

/* interact buttons */
.interact-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.act-btn{
  padding:10px 4px;border:none;border-radius:14px;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.act-btn:active{transform:scale(0.93);}
.act-btn .act-icon{font-size:1.5rem;}
.btn-feed{background:linear-gradient(135deg,#E8FFF4,#C8F5E4);color:var(--teal);}
.btn-play{background:linear-gradient(135deg,#FFF0F5,#FFE0EC);color:var(--rose);}
.btn-sleep{background:linear-gradient(135deg,#EEE8FF,#E0D5FF);color:var(--purple);}
.btn-bath{background:linear-gradient(135deg,#E8F5FF,#D0E8FF);color:var(--blue);}
.act-btn:hover{transform:scale(1.08) translateY(-2px);}

/* evolution track */
.evo-track{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:6px 2px;
  scrollbar-width:none;}
.evo-track::-webkit-scrollbar{display:none;}
.evo-node{display:flex;flex-direction:column;align-items:center;gap:3px;
  flex-shrink:0;padding:6px 8px;border-radius:14px;
  background:#F8F3EE;border:1.5px solid var(--peach);min-width:58px;transition:all 0.3s;}
.evo-node.done{background:linear-gradient(135deg,#FFF9E6,#FFE9A0);border-color:var(--gold);}
.evo-node.current{background:linear-gradient(135deg,#FFF0F5,#FFE0EC);border-color:var(--rose);
  box-shadow:0 3px 12px rgba(255,107,138,0.25);}
.evo-node .en-icon{font-size:1.5rem;filter:grayscale(1);opacity:0.3;}
.evo-node.done .en-icon,.evo-node.current .en-icon{filter:none;opacity:1;}
.evo-node .en-lbl{font-size:0.58rem;font-weight:800;color:var(--light);}
.evo-node.done .en-lbl{color:#B8860B;}
.evo-node.current .en-lbl{color:var(--rose);}
.evo-arrow{font-size:0.8rem;color:var(--peach);flex-shrink:0;}

/* ──────────────────────────────────
   CALENDAR PAGE
────────────────────────────────── */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.mn-btn{width:34px;height:34px;border:1.5px solid var(--peach);
  background:var(--cream);border-radius:50%;font-size:1.1rem;
  cursor:pointer;font-weight:900;transition:all 0.2s;color:var(--dark);}
.mn-btn:hover{background:var(--peach);}
.mn-title{font-size:1.05rem;font-weight:900;color:var(--dark);}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
.dow{text-align:center;font-size:0.68rem;font-weight:900;color:var(--light);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cd{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#F8F3EE;cursor:pointer;transition:all 0.2s;position:relative;}
.cd.empty{background:transparent;cursor:default;}
.cd.today{border:2px solid var(--rose);}
.cd .dn{font-size:0.75rem;font-weight:900;color:var(--mid);}
.cd.today .dn{color:var(--rose);}
.cd .ds{font-size:0.58rem;font-weight:900;color:var(--amber);line-height:1;margin-top:1px;}
.cd.full{background:linear-gradient(135deg,#FFE566,#FFB300);}
.cd.full .dn{color:#7A4500;}
.cd.partial{background:linear-gradient(135deg,#C8F5E4,#A8E6CF);}
.cd.partial .dn{color:#27AE60;}
.cd.none{background:#F8F3EE;}
.month-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.stat-box{border-radius:16px;padding:12px 8px;text-align:center;}
.stat-box .sv{font-size:1.4rem;font-weight:900;}
.stat-box .sl{font-size:0.68rem;font-weight:800;color:var(--mid);margin-top:2px;}
.sb-gold{background:linear-gradient(135deg,#FFF9E6,#FFE9A0);}.sb-gold .sv{color:#B8860B;}
.sb-green{background:linear-gradient(135deg,#E8FFF4,#C8F5E4);}.sb-green .sv{color:var(--teal);}
.sb-pink{background:linear-gradient(135deg,#FFF0F5,#FFE0EC);}.sb-pink .sv{color:var(--rose);}

/* detail popup */
.day-popup{
  position:fixed;inset:0;z-index:150;display:none;
  align-items:flex-end;justify-content:center;
}
.day-popup.show{display:flex;}
.dp-bg{position:absolute;inset:0;background:rgba(0,0,0,0.25);}
.dp-sheet{
  position:relative;background:var(--white);
  border-radius:28px 28px 0 0;padding:20px 18px 40px;
  width:100%;max-width:480px;
  box-shadow:0 -8px 30px var(--shadow);
  animation:slideUp 0.3s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.dp-handle{width:36px;height:4px;background:var(--peach);border-radius:4px;margin:0 auto 14px;}
.dp-title{font-size:1.05rem;font-weight:900;color:var(--dark);margin-bottom:10px;}

/* ──────────────────────────────────
   ADMIN PAGE
────────────────────────────────── */
.admin-warn{background:linear-gradient(135deg,#FFF9E6,#FFE9A0);border-radius:14px;
  padding:10px 14px;margin-bottom:12px;font-size:0.82rem;font-weight:700;color:#7A5500;
  display:flex;align-items:center;gap:6px;}
.inp{padding:10px 13px;border:2px solid var(--peach);border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:700;outline:none;
  background:var(--cream);transition:border-color 0.2s;width:100%;}
.inp:focus{border-color:var(--rose);background:white;}
.sel{padding:10px 11px;border:2px solid var(--peach);border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;
  background:var(--cream);cursor:pointer;outline:none;}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.btn-add{padding:10px 16px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:900;
  cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0;}
.btn-add:hover{transform:scale(1.05);}
.a-task{display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--cream);border-radius:14px;margin-bottom:7px;
  border-left:4px solid var(--blue);}
.a-task.ht{border-left-color:var(--teal);}
.at-name{flex:1;font-size:0.88rem;font-weight:800;color:var(--dark);}
.at-meta{font-size:0.68rem;color:var(--mid);font-weight:700;margin-top:1px;}
.ic-btn{width:30px;height:30px;border:none;border-radius:8px;
  cursor:pointer;font-size:0.85rem;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
.ic-btn.edit{background:#EEF4FF;color:#5B8DEF;}
.ic-btn.del{background:#FFF0F0;color:#E75480;}
.ic-btn:hover{transform:scale(1.12);}
.btn-wide{width:100%;padding:12px;border:none;border-radius:14px;
  font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:900;cursor:pointer;
  transition:all 0.2s;margin-top:6px;}
.btn-wide:hover{transform:translateY(-1px);}
.btn-reset{background:linear-gradient(135deg,var(--mint),#A8E6CF);color:var(--teal);}
.btn-danger{background:linear-gradient(135deg,#FFE0EC,#FFB3C6);color:var(--rose);}
.badge-row{display:inline-flex;align-items:center;gap:3px;
  background:var(--peach);border-radius:50px;padding:2px 8px;
  font-size:0.65rem;font-weight:800;color:var(--mid);}

/* ──────────────────────────────────
   MODALS
────────────────────────────────── */
/* celebration */
.cel{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s;}
.cel.show{opacity:1;pointer-events:all;}
.cel-bg{position:absolute;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(5px);}
.cel-card{
  position:relative;background:var(--white);border-radius:28px;
  padding:32px 40px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
  animation:celIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  max-width:300px;width:90%;
}
@keyframes celIn{0%{transform:scale(0.3) rotate(-8deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
.cel-emoji{font-size:4.5rem;animation:jmp 0.7s ease-in-out infinite alternate;}
@keyframes jmp{from{transform:translateY(0) scale(1);}to{transform:translateY(-16px) scale(1.1);}}
.cel-title{font-size:1.6rem;font-weight:900;color:var(--dark);margin:10px 0 6px;}
.cel-sub{font-size:0.9rem;font-weight:800;color:var(--amber);}
.cel-btn{margin-top:16px;padding:12px 30px;background:linear-gradient(135deg,var(--pink),var(--rose));
  border:none;border-radius:50px;color:white;font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:900;cursor:pointer;
  box-shadow:0 6px 18px rgba(255,107,138,0.4);}

/* pin */
.pin-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;}
.pin-modal.show{display:flex;}
.pm-bg{position:absolute;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(5px);}
.pm-card{position:relative;background:var(--white);border-radius:26px;
  padding:28px 32px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.25);
  min-width:270px;width:85%;}
.pm-title{font-size:1.1rem;font-weight:900;color:var(--dark);margin-bottom:4px;}
.pm-sub{font-size:0.8rem;color:var(--mid);font-weight:700;margin-bottom:16px;}
.pm-inp{width:100%;padding:12px;border:2px solid var(--peach);border-radius:14px;

//  SOUND ENGINE (Web Audio API — no files needed)
// ═══════════════════════════════════════
const Sound=(()=>{
  let ctx=null,muted=false;
  function init(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}
  function tone(freq,dur,type='sine',vol=0.25,delay=0){
    if(muted)return;
    init();
    const t0=ctx.currentTime+(delay/1000);
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(vol,t0);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur/1000);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t0);osc.stop(t0+dur/1000+0.05);
  }
  // Short click/pop
  function pop(freq=800){tone(freq,0.06,'sine',0.2);}
  // Task complete: cheerful ascending chime
  function taskComplete(){
    const notes=[523,659,784]; // C5 E5 G5
    notes.forEach((f,i)=>tone(f,0.18,'sine',0.3,i*80));
  }
  // Celebration fanfare
  function cel(){const n=[523,659,784,1047];n.forEach((f,i)=>tone(f,0.25,'triangle',0.35,i*100));}
  // Feed: crunchy munch
  function feed(){tone(150,0.08,'sawtooth',0.12);setTimeout(()=>tone(200,0.06,'sawtooth',0.1),60);setTimeout(()=>tone(180,0.06,'sawtooth',0.1),120);}
  // Play: happy boing
  function play(){tone(600,0.08,'square',0.1);setTimeout(()=>tone(800,0.1,'square',0.12),70);setTimeout(()=>tone(1000,0.12,'triangle',0.15),140);}
  // Sleep: soft descending
  function sleep(){tone(440,0.3,'sine',0.15);setTimeout(()=>tone(349,0.4,'sine',0.12),300);setTimeout(()=>tone(261,0.5,'sine',0.1),700);}
  // Bath: bubble pops
  function bath(){for(let i=0;i<5;i++)tone(900+Math.random()*600,0.05+Math.random()*0.06,'sine',0.12,i*80);}
  // Heart / pet tap
  function heart(){tone(988,0.1,'sine',0.18);setTimeout(()=>tone(1175,0.12,'sine',0.2),100);}
  return{taskComplete,cel,feed,play,sleep,bath,heart,pop,get muted(){return muted;},set muted(v){muted=v;},init};
})();

  if(id==='home')  renderHome();
  if(id==='pet')   renderPet();
  if(id==='cal')   renderCal();
  if(id==='admin') renderAdmin();
}

// ═══════════════════════════════════════
//  HOME
// ═══════════════════════════════════════
function renderHome(){
  document.getElementById('starCount').textContent=stars;
  const list=document.getElementById('taskList');
  if(!tasks.length){list.innerHTML='<div class="empty-s">📭 家长还没有添加任务哦～</div>';return;}
  list.innerHTML=tasks.map(t=>`
    <div class="task-item ${t.type==='habit'?'habit-t':''} ${t.done?'done-t':''}">
      <button class="check-btn ${t.done?'checked':''}" onclick="completeTask(${t.id})">
        ${t.done?'⭐':(t.type==='habit'?'🌱':'📚')}
      </button>
      <div class="t-info">
        <div class="t-name">${t.name}</div>
        <div class="t-meta">${t.type==='study'?'📚 学习':'🌱 习惯'} · ${t.stars||1}⭐/次</div>
      </div>
      <div class="t-pts">${t.done?`+${t.stars||1}⭐`:''}</div>
    </div>`).join('');
  // badges
  document.getElementById('badgeGrid').innerHTML=BADGES.map(b=>`
    <div class="bdg ${stars>=b.t?'on':''}">
      <div class="bi">${b.i}</div>
      <div class="bl">${b.n}</div>
    </div>`).join('');
}

function completeTask(id){
  const t=tasks.find(x=>x.id===id);
  if(!t||t.done)return;
  t.done=true;
  const pts=t.stars||1;
  stars+=pts; petXP+=pts;
  LS.set('ct_tasks',tasks);LS.set('ct_stars',stars);LS.set('ct_xp',petXP);
  // cal
  const dk=todayKey();
  if(!calData[dk])calData[dk]={done:0,total:tasks.length,stars:0};
  calData[dk].done++;calData[dk].stars+=pts;calData[dk].total=tasks.length;
  LS.set('ct_cal',calData);
  // log
  petLog.unshift({d:new Date().toLocaleDateString('zh-CN'),t:`完成「${t.name}」+${pts}XP`});
  if(petLog.length>30)petLog.pop();
  LS.set('ct_log',petLog);
  renderHome();
  showCel(t.name,pts);
  spawnConfetti();
  floatFx('⭐',null);
  Sound.taskComplete();
}

// ═══════════════════════════════════════
//  PET
// ═══════════════════════════════════════
function renderPet(){
  const a=getAnimal();
  // page title
  document.getElementById('petPageTitle').textContent=a.pageTitle;
  document.getElementById('petPageSub').textContent=a.pageSub;
  // animal chooser
  const ag=document.getElementById('animalGrid');
  ag.innerHTML=Object.entries(ANIMALS).map(([k,v])=>`
    <button class="an-btn ${selAnimal===k?'selected':''}" onclick="selectAnimal('${k}')">
      <span class="an-icon">${v.icon}</span>
      <span class="an-name">${v.name}</span>
    </button>`).join('');
  // evo
  const evo=getEvo(petXP,a.evos);
  const next=getNextEvo(petXP,a.evos);
  const idx=a.evos.indexOf(evo);
  // avatar
  document.getElementById('petAvatar').textContent=evo.icon;
  document.getElementById('petNameTag').textContent=petNickname;
  document.getElementById('petLv').textContent=`🌟 Lv.${idx+1} · ${evo.name}`;
  // mood
  const moodIdx=Math.min(Math.floor(petXP/10),a.moods.length-1);
  document.getElementById('petMoodBadge').textContent=a.moods[moodIdx]||a.moods[a.moods.length-1];
  // xp bar
  if(next){
    const prev=a.evos[idx];
    const pct=((petXP-prev.xp)/(next.xp-prev.xp)*100).toFixed(1);
    document.getElementById('xpFill').style.width=pct+'%';
    document.getElementById('xpRight').textContent=`${petXP}/${next.xp} 升级`;
  } else {
    document.getElementById('xpFill').style.width='100%';
    document.getElementById('xpRight').textContent='已最终进化！';
  }
  document.getElementById('xpLeft').textContent='经验值';
  // evo track
  document.getElementById('evoTrack').innerHTML=a.evos.map((e,i)=>`
    ${i>0?'<span class="evo-arrow">›</span>':''}
    <div class="evo-node ${petXP>=e.xp?'done':''} ${petXP>=e.xp&&(i===a.evos.length-1||petXP<a.evos[i+1]?.xp)?'current':''}">
      <span class="en-icon">${e.icon}</span>
      <span class="en-lbl">${e.name}</span>
    </div>`).join('');
  // idle speech
  showSpeech(rand(a.speeches.idle));
}

function selectAnimal(k){
  selAnimal=k;
  LS.set('ct_animal',k);
  // nickname prompt
  const nick=prompt(`给你的${ANIMALS[k].name}起个名字吧～`,petNickname);
  if(nick&&nick.trim())petNickname=nick.trim().substring(0,8);
  LS.set('ct_nick',petNickname);
  renderPet();
  spawnConfetti();
  Sound.cel();
}

let speechTimer=null;
function showSpeech(msg){
  const el=document.getElementById('petSpeech');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(speechTimer);
  speechTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

function tapPet(e){
  const a=getAnimal();
  showSpeech(rand(a.speeches.idle));
  heartFx(e.clientX,e.clientY);
  Sound.heart();
  const av=document.getElementById('petAvatar');
  av.className='pet-avatar happy';
  setTimeout(()=>av.className='pet-avatar idle',1500);
}

function doAction(type){
  const a=getAnimal();
  const msgs=a.speeches[type]||a.speeches.idle;
  showSpeech(rand(msgs));
  const av=document.getElementById('petAvatar');
  av.className=`pet-avatar ${type==='sleep'?'sleeping':type==='feed'?'eating':'happy'}`;
  setTimeout(()=>av.className='pet-avatar idle',2000);
  if(type==='feed'){petXP+=1;Sound.feed();}
  if(type==='play'){petXP+=1;Sound.play();}
  if(type==='feed'||type==='play'){
    LS.set('ct_xp',petXP);
    floatFx(type==='feed'?a.food:'🎉',null);
    setTimeout(renderPet,300);
  }
  if(type==='bath'){floatFx('🫧',null);Sound.bath();}
  if(type==='sleep'){floatFx('💤',null);Sound.sleep();}
  spawnConfetti(12);
}

// ═══════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════
function changeMonth(d){curMonth=new Date(curMonth.getFullYear(),curMonth.getMonth()+d,1);renderCal();}

function renderCal(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  document.getElementById('mnTitle').textContent=`${y}年 ${m+1}月`;
  const dows=['日','一','二','三','四','五','六'];
  document.getElementById('dowRow').innerHTML=dows.map(d=>`<div class="dow">${d}</div>`).join('');
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const today=new Date();
  let html='';
  for(let i=0;i<first;i++)html+=`<div class="cd empty"></div>`;
  let totalS=0,fullDays=0,activeDays=0;
  const trendData=[];
  for(let d=1;d<=days;d++){
    const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec=calData[dk];
    const isT=(y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate());
    let cls='cd'+(isT?' today':'');
    let inner=`<div class="dn">${d}</div>`;
    let pct=0;
    if(rec&&rec.total>0){
      activeDays++;pct=rec.done/rec.total;
      totalS+=rec.stars||0;
      if(rec.done>=rec.total){cls+=' full';fullDays++;}
      else if(rec.done>0) cls+=' partial';
      inner+=`<div class="ds">${rec.stars}⭐</div>`;
    }
    trendData.push({d,pct});
    html+=`<div class="${cls}" onclick="showDayDetail('${dk}',${d})">${inner}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
  document.getElementById('monthStat').innerHTML=`
    <div class="stat-box sb-gold"><div class="sv">${totalS}</div><div class="sl">本月星星</div></div>
    <div class="stat-box sb-green"><div class="sv">${fullDays}</div><div class="sl">全完成天</div></div>
    <div class="stat-box sb-pink"><div class="sv">${activeDays}</div><div class="sl">有记录天</div></div>`;
  // trend chart
  const last14=trendData.slice(-14);
  const maxH=64;
  document.getElementById('trendChart').innerHTML=last14.map(x=>{
    const h=Math.max(4,Math.round(x.pct*maxH));
    const col=x.pct>=1?'var(--gold)':x.pct>0?'var(--teal)':'var(--peach)';
    return `<div style="flex:1;height:${h}px;background:${col};border-radius:4px 4px 0 0;transition:height 0.5s;"></div>`;
  }).join('');
  document.getElementById('trendDates').innerHTML=last14.map(x=>`<span>${x.d}</span>`).join('');
}

function showDayDetail(dk,d){
  const rec=calData[dk];
  document.getElementById('dpTitle').textContent=`${curMonth.getMonth()+1}月${d}日`;
  if(!rec){
    document.getElementById('dpContent').innerHTML=`<div class="empty-s">这天还没有记录哦～</div>`;
  } else {
    document.getElementById('dpContent').innerHTML=`
      <div style="display:flex;gap:10px;flex-wrap:wrap;padding:8px 0;">
        <div style="background:var(--peach);border-radius:12px;padding:10px 16px;font-weight:800;font-size:0.9rem;color:var(--dark);">
          完成 <b>${rec.done}</b>/${rec.total} 项
        </div>
        <div style="background:linear-gradient(135deg,#FFF9E6,#FFE9A0);border-radius:12px;padding:10px 16px;font-weight:800;font-size:0.9rem;color:#B8860B;">
          获得 <b>${rec.stars}</b> ⭐
        </div>
        ${rec.done>=rec.total?'<div style="background:linear-gradient(135deg,#C8F5E4,#A8E6CF);border-radius:12px;padding:10px 16px;font-weight:800;font-size:0.9rem;color:var(--teal);">🏆 全部完成！</div>':''}
      </div>`;
  }
  document.getElementById('dayPopup').classList.add('show');
}
function closeDayPopup(){document.getElementById('dayPopup').classList.remove('show');}

// ═══════════════════════════════════════
//  ADMIN
// ═══════════════════════════════════════
function renderAdmin(){
  const list=document.getElementById('adminList');
  if(!tasks.length){list.innerHTML='<div class="empty-s">还没有任务，快来添加吧！</div>';return;}
  list.innerHTML=tasks.map(t=>`
    <div class="a-task ${t.type==='habit'?'ht':''}">
      <div style="flex:1;">
        <div class="at-name">${t.name}</div>
        <div class="at-meta">${t.type==='study'?'📚 学习':'🌱 习惯'} · ${t.stars||1}⭐
          <span class="badge-row">${t.repeat==='daily'?'每天':'仅今天'}</span>
        </div>
      </div>
      <button class="ic-btn edit" onclick="adminEdit(${t.id})">✏️</button>
      <button class="ic-btn del" onclick="adminDel(${t.id})">🗑️</button>
    </div>`).join('');
}
function adminAdd(){
  const name=document.getElementById('aName').value.trim();
  if(!name)return;
  tasks.push({id:Date.now(),name,type:document.getElementById('aType').value,
    repeat:document.getElementById('aRepeat').value,stars:parseInt(document.getElementById('aStars').value),done:false});
  document.getElementById('aName').value='';
  LS.set('ct_tasks',tasks);renderAdmin();
}
function adminDel(id){
  if(!confirm('确认删除？'))return;
  tasks=tasks.filter(t=>t.id!==id);LS.set('ct_tasks',tasks);renderAdmin();
}
function adminEdit(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const n=prompt('修改任务名称：',t.name);
  if(n&&n.trim()){t.name=n.trim().substring(0,15);LS.set('ct_tasks',tasks);renderAdmin();}
}
function resetDay(){
  if(!confirm('确认重置今日任务？'))return;
  const dk=todayKey();
  if(!calData[dk])calData[dk]={done:0,total:tasks.length,stars:0};
  calData[dk].total=tasks.length;LS.set('ct_cal',calData);
  tasks.forEach(t=>{if(t.repeat==='daily')t.done=false;});
  tasks=tasks.filter(t=>t.repeat!=='once'||!t.done);
  LS.set('ct_tasks',tasks);renderAdmin();
  alert('✅ 已重置！新的一天开始啦 🌅');
}
function resetAll(){
  if(!confirm('确认清空所有数据？不可恢复！'))return;
  ['ct_tasks','ct_stars','ct_cal','ct_xp','ct_log'].forEach(k=>localStorage.removeItem(k));
  tasks=[];stars=0;calData={};petXP=0;petLog=[];
  LS.set('ct_tasks',tasks);LS.set('ct_stars',stars);
  renderAdmin();alert('已清空！');
}
function praiseKid(msg,e){
  showSimpleCel(e,'爸妈说：',msg);spawnConfetti();
}

// ═══════════════════════════════════════
//  CELEBRATIONS & FX
// ═══════════════════════════════════════
function showCel(name,pts){
  const c=rand(CELS);
  document.getElementById('celE').textContent=c.e;
  document.getElementById('celT').textContent=c.t;
  document.getElementById('celS').textContent=`「${name}」完成！+${pts}⭐（共${stars}颗）`;
  document.getElementById('cel').classList.add('show');
  Sound.cel();
}
function showSimpleCel(e,t,s){
  document.getElementById('celE').textContent=e;
  document.getElementById('celT').textContent=t;
  document.getElementById('celS').textContent=s;
  document.getElementById('cel').classList.add('show');
}
function closeCel(){document.getElementById('cel').classList.remove('show');}

function spawnConfetti(n=40){
  const cols=['#FF9BB5','#FFD166','#74B9FF','#55EFC4','#C49FE6','#FFB347','#FF6B8A'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='confetti';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${rand(cols)};animation-duration:${1+Math.random()*1.5}s;animation-delay:${Math.random()*0.4}s;border-radius:${Math.random()>.5?'50%':'3px'};`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2500);
  }
}
function floatFx(emoji,e){
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='float-fx';
      el.style.cssText=`left:${25+Math.random()*50}vw;bottom:${15+Math.random()*20}vh;font-size:${1.5+Math.random()}rem;`;
      el.textContent=emoji;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1200);
    },i*100);
  }
}
function heartFx(x,y){
  const hearts=['💖','💕','❤️','💗'];
  for(let i=0;i<4;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='heart-fx';
      el.style.cssText=`left:${x-20+Math.random()*40-20}px;top:${y-20}px;`;
      el.textContent=rand(hearts);
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1000);
    },i*80);
  }
}
